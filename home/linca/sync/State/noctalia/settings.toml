config_version = 12

[bar]
order = [ "Linca", "task" ]

    [bar.Linca]
    background_opacity = 0.0
    capsule = true
    capsule_padding = 5.0
    center = [ "active_window", "media" ]
    end = [ "tray", "group:g3", "network", "group:g2", "battery", "clock" ]
    font_family = "Noto Sans"
    margin_edge = 0
    margin_ends = 0
    scale = 0.85000000521540642
    shadow = false
    start = [ "workspaces", "group:g1", "weather" ]
    thickness = 25
    widget_spacing = 3

        [[bar.Linca.capsule_group]]
        fill = "surface_variant"
        id = "g1"
        members = [ "cpu", "sysmon" ]
        opacity = 1.0
        padding = 4.0

        [[bar.Linca.capsule_group]]
        fill = "surface_variant"
        id = "g2"
        members = [ "bluetooth", "volume", "brightness", "notifications" ]
        opacity = 1.0
        padding = 4.0

        [[bar.Linca.capsule_group]]
        fill = "surface_variant"
        id = "g3"
        members = [ "wallhaven", "clipboard" ]
        opacity = 1.0
        padding = 4.0

    [bar.task]
    center = [ "control-center", "launcher", "taskbar" ]
    concave_edge_corners = true
    enabled = true
    end = [ "tray_2", "group:g1", "group:g2" ]
    font_family = "Noto Sans"
    margin_edge = 0
    margin_ends = 0
    position = "bottom"
    radius = 0
    radius_bottom_right = 80
    start = [ "wallpaper", "weather", "audio_visualizer", "media" ]
    thickness = 45
    widget_spacing = 9

        [[bar.task.capsule_group]]
        fill = "surface_variant"
        id = "g1"
        members = [ "network_2", "volume_2", "battery" ]
        opacity = 1.0
        padding = 6.0

        [[bar.task.capsule_group]]
        fill = "surface_variant"
        id = "g2"
        members = [ "spacer_2", "clock_2", "notifications" ]
        opacity = 1.0
        padding = 6.0

