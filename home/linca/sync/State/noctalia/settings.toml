[dock]
auto_hide = true
reserve_space = false
show_dots = true

[hooks]
theme_mode_changed = "dconf write /org/gnome/desktop/interface/color-scheme \"\\\"prefer-$NOCTALIA_THEME_MODE\\\"\""

[idle]
behavior_order = [ "idle-behavior", "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.idle-behavior]
    action = "lock"
    enabled = false
    timeout = 30.0

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

